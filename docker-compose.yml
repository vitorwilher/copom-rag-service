services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GENERATION_MODEL=claude-haiku-4-5
      - JUDGE_MODEL=claude-sonnet-4-5
    volumes:
      # monta o código para hot-reload em desenvolvimento (opcional)
      - ./src:/app/src
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # Serviço opcional: Postgres + pgvector como vector store denso.
