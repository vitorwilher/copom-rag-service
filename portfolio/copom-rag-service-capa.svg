<text x="32.0" y="48.9" font-size="22" fill="#1e1e1e" text-anchor="start" font-weight="700">COPOM RAG Service — arquitetura de engenharia de LLM</text>
<text x="32.0" y="72.3" font-size="13" fill="#868e96" text-anchor="start" font-weight="400">Card AI/LLM Engineer · o diferencial é a engenharia de qualidade ao redor do RAG</text>
<text x="40.0" y="106.5" font-size="11" fill="#868e96" text-anchor="start" font-weight="400">CONTEXTO — pesquisa macro de banco</text>
<text x="40.0" y="126.5" font-size="11" fill="#868e96" text-anchor="start" font-weight="400">público-alvo plural: o próprio economista de pesquisa · mesa de rates · economista-chefe · sales · risco/compliance · cliente externo</text>
<text x="752.0" y="106.5" font-size="11" fill="#868e96" text-anchor="start" font-weight="400">o sinal do Copom = ① direção (Sentimento) + ② magnitude (Taylor) + ③ narrativa (ESTE RAG: atribuição citável)</text>
<text x="40.0" y="170.3" font-size="13" fill="#0c8599" text-anchor="start" font-weight="400">① INGESTÃO + INDEXAÇÃO  (batch, offline)</text>
<text x="105.0" y="222.7" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="400">API BCB</text>
<text x="105.0" y="237.7" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="400">atas + Focus</text>
<text x="258.0" y="222.7" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="400">parse HTML</text>
<text x="258.0" y="237.7" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="400">+ limpeza</text>
<text x="421.0" y="222.7" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="400">chunking</text>
<text x="421.0" y="237.7" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="400">1200 car · overlap 200</text>
<text x="599.0" y="222.7" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="400">metadados</text>
<text x="599.0" y="237.7" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="400">fonte·data·seção</text>
<text x="772.0" y="222.7" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="400">embeddings</text>
<text x="772.0" y="237.7" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="400">provider ou local</text>
<text x="945.0" y="222.7" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="400">índice denso</text>
<text x="945.0" y="237.7" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="400">em memória</text>
<text x="1123.0" y="222.7" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="400">índice BM25</text>
<text x="1123.0" y="237.7" font-size="12" fill="#1e1e1e" text-anchor="middle" font-weight="400">(rank-bm25)</text>
<text x="40.0" y="350.4" font-size="13" fill="#1971c2" text-anchor="start" font-weight="400">② RETRIEVAL HÍBRIDO + RERANK  (por request)</text>
<text x="552.0" y="348.4" font-size="11" fill="#1971c2" text-anchor="start" font-weight="400">↑ consulta os índices da faixa ① (denso + BM25)</text>
